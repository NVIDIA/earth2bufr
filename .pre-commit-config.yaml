ci:
  # uv is not available on the pre-commit.ci runner; these hooks only run locally
  skip: [ty, uv-lock]

repos:
  # ── General file checks ──────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=5000]
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml

  # ── Python: Ruff (linting + formatting) ──────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-format
      - id: ruff
        args: [--fix]

  # ── Python: Docstring coverage ───────────────────────────────────────────
  - repo: https://github.com/econchick/interrogate
    rev: 1.7.0
    hooks:
      - id: interrogate
        args: [
          "-vv", "--ignore-init-method",
          "--ignore-module", "--ignore-private", "--ignore-semiprivate",
          "--ignore-magic", "--fail-under=99",
          "-e", "setup.py", "-e", "test", "-e", "build", "-e", "docs",
          "--color", "src/earth2bufr/"]
        pass_filenames: false

  # ── Markdown ─────────────────────────────────────────────────────────────
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.50.0
    hooks:
      - id: markdownlint
        args: [--config, .markdownlint.json]

  # ── Local hooks (Rust tooling + ty) ──────────────────────────────────────
  - repo: local
    hooks:
      - id: ty
        name: ty (type checking)
        language: system
        entry: uv run ty check
        types: [python]
        pass_filenames: false

      - id: cargo-fmt
        name: cargo fmt
        language: system
        entry: bash -c 'command -v cargo >/dev/null 2>&1 && cargo fmt -- --check || echo "cargo not found, skipping"'
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        language: system
        entry: bash -c 'command -v cargo >/dev/null 2>&1 && cargo clippy -- -D warnings || echo "cargo not found, skipping"'
        types: [rust]
        pass_filenames: false

      - id: cargo-deny
        name: cargo deny
        language: system
        entry: bash -c 'command -v cargo >/dev/null 2>&1 && cargo deny check || echo "cargo not found, skipping"'
        types: [toml]
        pass_filenames: false

      - id: uv-lock
        name: uv lock --check
        language: system
        entry: uv lock --check
        files: pyproject\.toml$
        pass_filenames: false
