[package]
name = "earth2bufr"
version = "0.1.0-alpha.0"
edition = "2021"
license = "Apache-2.0"
description = "Rust-based BUFR file parser"

[lib]
name = "_lib"
crate-type = ["cdylib"]
path = "src/rust/lib.rs"

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py311"] }
arrow = { version = "55", default-features = false, features = ["ffi"] }
arrow-select = "55"
pyo3-arrow = "0.9"
rayon = "1.10"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
memchr = "2.7"           # Fast SIMD-accelerated byte searching
smallvec = { version = "1.13", features = ["serde"] }  # Stack-allocated small vectors
rustc-hash = "2"         # Fast non-cryptographic hashing for integer keys
sha2 = "0.10"             # Embedded DX table hashes

[profile.release]
lto = "fat"              # Full link-time optimization for best performance
codegen-units = 1        # Better optimization at cost of compile time
opt-level = 3            # Maximum optimization
strip = true             # Strip symbols for smaller binary
