[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "earth2bufr"
version = "0.1.0a0"
description = "Rust-based BUFR file parser with Python bindings"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.txt", "src/earth2bufr/tables/NOTICE"]
dependencies = [
    "pyarrow>=14.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15",
    "pytest>=8.0",
    "pytest-cov>=7.0",
    "pytest-timeout>=2.3",
    "interrogate>=1.7",
    "pre-commit>=4.0",
    "maturin>=1.5",
    "ty>=0.0.1a7",
]
test = [
    "earth2bufr[dev]",
    "eccodes>=2.47.0",
    # The Python bindings alone can load an outdated system library and tables.
    "eccodeslib>=2.42.0; sys_platform == 'linux' or sys_platform == 'darwin'",
    "numpy>=1.24",
    "pandas>=2.0",
    "pybufrkit>=0.2",
    "satpy>=0.60.0",
]
docs = [
    "sphinx>=9.0,<10",
    "myst-parser>=5.0,<6",
    "sphinx-autodoc-typehints>=3.1,<3.7",
    "sphinx-autoapi>=3.8,<4",
    "sphinx-copybutton>=0.5",
    "numpydoc>=1.10",
    "furo>=2024.1",
]

[tool.maturin]
features = ["pyo3/extension-module", "pyo3/abi3-py311", "pyo3/generate-import-lib"]
python-source = "src"
module-name = "earth2bufr._lib"
include = ["src/earth2bufr/tables/*.json", "src/earth2bufr/tables/NOTICE"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".cargo", ".uv-cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D", "UP", "N", "B", "A", "C4", "SIM", "TCH", "PTH", "ERA"]

[tool.ruff.lint.per-file-ignores]
"test/**" = ["S101", "D"]
".github/scripts/test_*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-v --tb=short"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring external resources",
    "rust: tests requiring the Rust backend (maturin develop)",
    "slow: long-running tests",
]

[tool.coverage.run]
source = ["earth2bufr"]

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

[tool.interrogate]
fail-under = 99
ignore-init-method = true
ignore-init-module = false
ignore-module = true
ignore-private = true
ignore-semiprivate = true
ignore-magic = true
exclude = ["test", "docs", ".uv-cache", ".cargo"]
color = true
verbose = 2

[tool.ty.rules]
# Rust extension module and optional deps are not resolvable at type-check time
unresolved-import = "ignore"
unresolved-attribute = "ignore"
